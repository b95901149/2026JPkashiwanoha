function fitTo(L){if(!L.length)return;const b=new maplibregl.LngLatBounds();L.forEach(i=>b.extend([V[i].lng,V[i].lat]));
 ACTS.forEach(a=>{if(tripF>=0&&a.k===tripF)a.lines.forEach(l=>l.forEach(q=>b.extend(q)));});
 const o={padding:pads(),pitch:55,bearing:-18,maxZoom:15,duration:RM?0:2600};map.fitBounds(b,o);}
function overview(){tourStop();hideCard();cur=-1;map.getSource('sel').setData({type:'FeatureCollection',features:[]});refresh();
 const L=visList();fitTo(L.length?L:V.map((_,i)=>i));}
$('ovw').onclick=overview;
$('ter').onclick=()=>{terrainOn=!terrainOn;$('ter').classList.toggle('on',terrainOn);map.setTerrain(terrainOn?{source:'dem',exaggeration:1.4}:null);
 map.setLayoutProperty('hs','visibility',terrainOn?'visible':'none');};
$('bm').onchange=()=>{const k=$('bm').value;map.getSource('base').setTiles([BM[k]]);const P=k==='dark'?DARK:LIGHT;Object.keys(P).forEach(p=>map.setPaintProperty('base',p,P[p]));};
$('scl').onclick=()=>{$('side').classList.add('closed');setTimeout(()=>map.resize(),400);};
$('sbtn').onclick=()=>$('side').classList.remove('closed');
if(innerWidth<=700)$('side').classList.add('closed');
// ---- 語言 ----
function applyLang(){TX=TXS[LANG];document.documentElement.lang=LANG==='ja'?'ja':'zh-Hant';document.title=TX.title;
 document.querySelectorAll('[data-t]').forEach(e=>e.textContent=TX[e.dataset.t]);
 $('lng').textContent=LANG==='ja'?'中文':'日本語';$('q').placeholder=TX.search;
 const days=new Set(V.map(v=>v.d)).size;$('sub').textContent=TX.sub(V.length,ALL.trips.length,days);
 $('trip').innerHTML=`<option value="-1">${TX.all}</option>`+ALL.trips.map((t,k)=>`<option value="${k}">${esc(tripName(k))}</option>`).join('');$('trip').value=tripF;
 tld();tourBtn();if(ready)refresh();if(cur>=0&&$('card').style.display==='block')showCard(cur);}
$('lng').onclick=()=>{LANG=LANG==='ja'?'zh':'ja';try{const u=new URL(location.href);if(LANG==='ja')u.searchParams.set('lang','ja');else u.searchParams.delete('lang');history.replaceState(null,'',u);}catch(e){}applyLang();};
applyLang();renderList();
// ---- 滑過提示、點標記 ----
const tip=$('tip');
map.on('mousemove','v-glow',e=>{const f=e.features[0];if(!f)return;const i=f.properties.i;if(!vis(i)){tip.style.display='none';return;}map.getCanvas().style.cursor='pointer';const v=V[i];
 tip.innerHTML=`${thumbImg(v)}<b>${esc(ttl(v))}</b><div style="color:var(--mu)">${dayStr(v.di)} ${v.t} · ${durStr(v.dur)}</div>`;
 tip.style.display='block';const x=Math.min(e.point.x+14,innerWidth-200),y=Math.min(e.point.y+14,innerHeight-170);tip.style.left=x+'px';tip.style.top=y+'px';});
map.on('mouseleave','v-glow',()=>{tip.style.display='none';map.getCanvas().style.cursor='';});
map.on('click','v-glow',e=>{const fs=e.features.filter(f=>vis(f.properties.i));if(!fs.length)return;tip.style.display='none';tourStop();select(fs[0].properties.i);});
function place(){document.documentElement.style.setProperty('--barh',$('bar').offsetHeight+'px');}
addEventListener('resize',place);place();
function hav(a,b){const r=Math.PI/180,p1=a[0]*r,p2=b[0]*r,dp=p2-p1,dl=(b[1]-a[1])*r;return 2*6371000*Math.asin(Math.sqrt(Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2));}
map.on('load',()=>{ready=true;
 try{map.setSky({'sky-color':'#0a1630','horizon-color':'#3b2a5c','fog-color':'#0d1830','sky-horizon-blend':.6,'horizon-fog-blend':.5,'fog-ground-blend':.25,'atmosphere-blend':.8});}catch(e){}
 refresh();
 const pv=Q.get('v'),i0=pv?V.findIndex(v=>v.id===pv):-1;
 const cam=map.cameraForBounds(B0,{padding:pads(),pitch:52,bearing:-18,maxZoom:14})||{};
 if(RM){map.jumpTo({...cam,pitch:52,bearing:-18});if(i0>=0)select(i0);}
 else{map.flyTo({...cam,pitch:52,bearing:-18,duration:4200,curve:1.2,essential:true});   // 開場：從高空俯衝進入
  if(i0>=0)setTimeout(()=>select(i0),4400);}
 requestAnimationFrame(frame);});
window.V3={map,V,ACTS,select,tourStart,tourGo,tourStop,get cur(){return cur},get tour(){return tour}};
</script></body></html>
