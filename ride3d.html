umb/p_IMG_20260922_114614.jpg","full":"img/photo/IMG_20260922_114614.jpg","t":"11:46","lat":35.6252,"lng":139.77726,"km":71.222,"seg":0,"zh":"到台場，先拍富士電視台的大樓，再去看實物大的獨角獸鋼彈立像，從不同角度拍了好幾張，還和鋼彈合照 XD","ja":"お台場に到着。フジテレビの建物を撮り、実物大のユニコーンガンダム立像をいろいろな角度から撮影。ガンダムと一緒に自撮りもしました。"},{"th":"img/tour_thumb/p_MVIMG_20260922_115001.jpg","full":"img/photo/MVIMG_20260922_115001.jpg","t":"11:50","lat":35.62445,"lng":139.77543,"km":71.222,"seg":0,"zh":"","ja":""},{"th":"img/tour_thumb/p_MVIMG_20260922_115011.jpg","full":"img/photo/MVIMG_20260922_115011.jpg","t":"11:50","lat":35.62445,"lng":139.77543,"km":71.222,"seg":0,"zh":"","ja":""},{"th":"img/tour_thumb/p_IMG_20260922_120036.jpg","full":"img/photo/IMG_20260922_120036.jpg","t":"12:00","lat":35.62444,"lng":139.77545,"km":71.222,"seg":0,"zh":"","ja":""},{"th":"img/tour_thumb/p_MVIMG_20260922_113641.jpg","full":"img/photo/MVIMG_20260922_113641.jpg","t":"11:36","lat":35.63104,"lng":139.78913,"km":72.507,"seg":0,"zh":"","ja":""},{"th":"img/tour_thumb/p_IMG_20260922_113658.jpg","full":"img/photo/IMG_20260922_113658.jpg","t":"11:36","lat":35.63104,"lng":139.78913,"km":72.507,"seg":0,"zh":"","ja":""},{"th":"img/tour_thumb/p_IMG_20260922_125551.jpg","full":"img/photo/IMG_20260922_125551.jpg","t":"12:55","lat":35.65286,"lng":139.86884,"km":81.386,"seg":0,"zh":"午餐補給，一手拿著咬了一口的麵包，旁邊是附肉排的小餐盒，邊騎邊吃。","ja":"昼の補給。かじりかけのパンと、おかずの入ったパックを手に、走りながらの食事です。"},{"th":"img/tour_thumb/p_IMG_20260922_092226.jpg","full":"img/photo/IMG_20260922_092226.jpg","t":"09:22","lat":35.67343,"lng":139.87703,"km":83.881,"seg":0,"zh":"騎進一段有行道樹的水道步道，經過橋下，路況平穩，接近東京灣一帶。","ja":"並木のある水路沿いの遊歩道へ。橋の下をくぐり、穏やかな路面が続きます。東京湾が近づいてきました。"},{"th":"img/tour_thumb/p_IMG_20260922_092230.jpg","full":"img/photo/IMG_20260922_092230.jpg","t":"09:22","lat":35.67346,"lng":139.87692,"km":83.881,"seg":0,"zh":"","ja":""},{"th":"img/tour_thumb/p_IMG_20260922_142022.jpg","full":"img/photo/IMG_20260922_142022.jpg","t":"14:20","lat":35.75837,"lng":139.87773,"km":97.678,"seg":0,"zh":"抵達柴又帝釋天。看了帝釋天的建築和「柴又帝釋天」石碑，在參道上 :36.17789,"lng":139.63635,"km":119.322,"seg":0,"zh":"在河堤旁的休息站補給：拍了腿上的擦傷 Orz 另外在大樓前與草地上自拍、看展示的天文儀器，還吃了一條豆沙類的零食。","ja":"堤防脇の休憩所で補給。脚のすり傷の記録、建物前や芝生での自撮り、展示の天体投影機、そして小腹満たしのおやつ。"},{"th":"img/tour_thumb/p_MVIMG_20260927_101608.jpg","full":"img/photo/MVIMG_20260927_101608.jpg","t":"10:16","lat":36.17734,"lng":139.63528,"km":119.322,"seg":0,"zh":"","ja":""},{"th":"img/tour_thumb/p_MVIMG_20260927_101625.jpg","full":"img/photo/MVIMG_20260927_101625.jpg","t":"10:16","lat":36.17734,"lng":139.63528,"km":119.322,"seg":0,"zh":"","ja":""},{"th":"img/tour_thumb/p_IMG_20260927_101652.jpg","full":"img/photo/IMG_20260927_101652.jpg","t":"10:16","lat":36.17729,"lng":139.63543,"km":119.322,"seg":0,"zh":"","ja":""},{"th":"img/tour_thumb/p_IMG_20260927_101759.jpg","full":"img/photo/IMG_20260927_101759.jpg","t":"10:17","lat":36.1777,"lng":139.63622,"km":119.322,"seg":0,"zh":"","ja":""},{"th":"img/tour_thumb/p_IMG_20260927_101958.jpg","full":"img/photo/IMG_20260927_101958.jpg","t":"10:19","lat":36.1777,"lng":139.63622,"km":119.322,"seg":0,"zh":"","ja":""},{"th":"img/tour_thumb/p_IMG_20260927_102159.jpg","full":"img/photo/IMG_20260927_102159.jpg","t":"10:21","lat":36.17766,"lng":139.63625,"km":119.322,"seg":0,"zh":"","ja":""},{"th":"img/tour_thumb/p_IMG_20260927_104429.jpg","full":"img/photo/IMG_20260927_104429.jpg","t":"10:44","lat":36.17777,"lng":139.63658,"km":119.322,"seg":0,"zh":"","ja":""},{"th":"img/tour_thumb/p_IMG_20260927_144236.jpg","full":"img/photo/IMG_20260927_144236.jpg","t":"14:42","lat":36.16017,"lng":139.67589,"km":124.125,"seg":0,"zh":"回程河堤旁的一條小水路，兩側長滿雜草，天色依然陰沉。","ja":"帰路の堤防脇を流れる小さな水路。両側に草が茂り、空は相変わらず曇り。"},{"th":"img/tour_thumb/p_IMG_20260927_092146.jpg","full":"img/photo/IMG_20260927_092146.jpg","t":"09:21","lat":36.10826,"lng":139.76968,"km":136.014,"seg":0,"zh":"利根川堤防上筆直的自行車道，路旁立著距離標示牌，一路往上游延伸。","ja":"利根川の堤防に延びるまっすぐなサイクリングロード。脇には距離標識が立ち、上流へと続く。"},{"th":"img/tour_thumb/p_IMG_20260927_152418.jpg","full":"img/photo/IMG_20260927_152418.jpg","t":"15:24","lat":36.09962,"lng":13 140.30452,"km":58.14,"seg":0,"zh":"","ja":""},{"th":"img/tour_thumb/p_MVIMG_20261004_112230.jpg","full":"img/photo/MVIMG_20261004_112230.jpg","t":"11:22","lat":35.97523,"lng":140.35132,"km":73.35,"seg":0,"zh":"在寫著「霞ヶ浦 KASUMIGAURA」的站牌風標誌前自拍，單車就停在湖邊的自行車道上。","ja":"「霞ヶ浦 KASUMIGAURA」と書かれた駅名標風の看板の前で自撮り。愛車は湖畔のサイクリングロードに停めてある。"},{"th":"img/tour_thumb/p_IMG_20261004_112249.jpg","full":"img/photo/IMG_20261004_112249.jpg","t":"11:22","lat":35.97533,"lng":140.35186,"km":73.35,"seg":0,"zh":"","ja":""},{"th":"img/tour_thumb/p_MVIMG_20261004_122345.jpg","full":"img/photo/MVIMG_20261004_122345.jpg","t":"12:23","lat":35.95597,"lng":140.46452,"km":88.24,"seg":0,"zh":"湖岸南線的堤防邊，站在霞浦的導覽看板旁自拍，背景是寬闊的湖面。","ja":"湖岸南側の堤防にて。霞ヶ浦の案内看板のそばで自撮り。背景には広い湖面。"},{"th":"img/tour_thumb/p_IMG_20261004_122640.jpg","full":"img/photo/IMG_20261004_122640.jpg","t":"12:26","lat":35.96178,"lng":140.47331,"km":89.402,"seg":0,"zh":"沿霞浦湖岸的自行車道，路旁是堤防和停靠的小船，天空雲層很厚。","ja":"霞ヶ浦の湖岸に沿ったサイクリングロード。脇には堤防と係留された小舟、空には厚い雲。"},{"th":"img/tour_thumb/p_MVIMG_20261004_122647.jpg","full":"img/photo/MVIMG_20261004_122647.jpg","t":"12:26","lat":35.96634,"lng":140.50221,"km":94.566,"seg":0,"zh":"在湖邊邊騎邊吃補給的點心，自拍時嘴裡咬著能量棒 XD","ja":"湖畔で補給のおやつをかじりながら自撮り。"},{"th":"img/tour_thumb/p_MVIMG_20261004_125850.jpg","full":"img/photo/MVIMG_20261004_125850.jpg","t":"12:58","lat":36.0133,"lng":140.46506,"km":101.861,"seg":0,"zh":"繼續沿湖騎，在湖邊的柏油路與消波塊旁自拍，水面一直延伸到天邊。","ja":"湖沿いを走り続ける。舗装路と消波ブロックのそばで自撮り。水面が空まで続く。"},{"th":"img/tour_thumb/p_IMG_20261004_110117.jpg","full":"img/photo/IMG_20261004_110117.jpg","t":"11:01","lat":36.06972,"lng":140.41955,"km":109.617,"seg":0,"zh":"湖岸邊立著霞浦的說明看板，後面是一望無際的湖面。","ja":"湖畔に立つ霞ヶ浦の説明看板。背後には広い湖面が広がる。"},{"th":"img/tour_thumb/p_IMG_20261004_132936.jpg","full":"img/photo/IMG_20261004_132936.jpg","t":"13:29","lat":36.09565,"lng":140.40245,"km":113.751,"seg":0,"zh":"到霞浦大橋和道の駅たまつくり一帶，遠看紅色大橋跨越湖面，並在站內看了霞浦風景照的展示。","ja":"霞ヶ浦大橋と道の駅たまつくり付近へ。湖にかかる赤い大橋を遠望し、館内では霞ヶ浦の風景写真の展示も見た。"},{"th":"img/tour_thumb/p_MVIMG_20261004_132945.jpg","full":"img/photo/MVIMG_20261004_132945.jpg","t":"13:29","lat":36.09591,"lng":140.40287,"km":113.751,"seg":0,"zh":"","ja":""},{"th":"img/tour_thumb/p_IMG_20261004_133104.jpg","full":"img/photo/IMG_20261004_133104.jpg","t":"13:31","lat":36.09591,"lng":140.40299,"km":113.751,"seg":0,"zh":"","ja":""},{"th":"img/tour_thumb/p_IMG_20261004_135100.jpg","full":"img/photo/IMG_20261004_135100.jpg","t":"13:51","lat":36.0696,"lng":140.37469,"km":117.989,"seg":0,"zh":"湖面上遠遠看到一艘帆引船，也看到湖邊的 JR 土浦站方向指示牌，標示著剩下的距離。","ja":"湖上に遠く帆引船が見えた。湖畔には JR 土浦駅方面の案内標識があり、残りの距離が示されている。"},{"th":"img/tour_thumb/p_IMG_20261004_135104.jpg","full":"img/photo/IMG_20261004_135104.jpg","t":"13:51","lat":36.0696,"lng":140.37469,"km":117.989,"seg":0,"zh":"","ja":""},{"th":"img/tour_thumb/p_IMG_20261004_135206.jpg","full":"img/photo/IMG_20261004_135206.jpg","t":"13:52","lat":36.06986,"lng":140.37481,"km":117.989,"seg":0,"zh":"","ja":""},{"th":"img/tour_thumb/p_IMG_20261004_135214.jpg","full":"img/photo/IMG_20261004_135214.jpg","t":"13:52","lat":36.06964,"lng":140.37474,"km":117.989,"seg":0,"zh":"","ja":""},{"th":"img/tour_thumb/p_IMG_20261004_135925.jpg","full":"img/photo/IMG_20261004_135925.jpg","t":"13:59","lat":36.0632,"lng":140.34941,"km":120.758,"seg":0,"zh":"在湖邊遠眺對岸，隔著閃閃發亮的湖水，隱約看得到牛久大佛的身影；近處還有一座立在水中的小屋。","ja":"湖越しに対岸を眺めると、きらめく湖面の向こうに牛久大仏の姿がうっすら見える。近くには水上に建つ小屋も。"},{"th":"img/tour_thumb/p_IMG_20261004_135943.jpg","full":"img/photo/IMG_20261004_135943.jpg","t":"13:59","lat":36.0632,"lng":140.34941,"km":120.758,"seg":0,"zh":"","ja":""},{"th":"img/tour_thumb/p_IMG_20261004_144528.jpg","full":"img/photo/IMG_20261004_144528.jpg","t":"14:45","lat":36.08362,"lng":140.21313,"km":136.134,"seg":0,"zh":"回到 Rinrin Port 土浦，單車靠在入口旁，店外有園區的導覽地圖。","ja":"りんりんポート土浦に戻ってきた。入口脇に自転車を立てかけ、外には園内の案内地図がある。"},{"th":"img/tour_thumb/p_IMG_20261004_090932.jpg","full":"img/photo/IMG_20261004_090932.jpg","t":"09:09","lat":36.03203,"lng":140.16142,"km":144.159,"seg":0,"zh":"經過一段市區道路，路邊停著車，藍色路標指引方向，繼續往土浦前進。","ja":"市街地の道路を通過。路肩に車が停まり、青い道路標識が方向を示す。土浦へ向けてさらに進む。"},{"th":"img/tour_thumb/p_MVIMG_20261004_083022.jpg","full":"img/photo/MVIMG_20261004_083022.jpg","t":"08:30","lat":35.94316,"lng":140.13664,"km":155.098,"seg":0,"zh":"","ja":""},{"th":"img/tour_thumb/p_IMG_20261004_082458.jpg","full":"img/photo/IMG_20261004_082458.jpg","t":"08:24","lat":35.93479,"lng":140.1337,"km":156.123,"seg":0,"zh":"到小貝川水門，白色的水門塔橫跨河道，在護欄邊和路旁的彩色造型地標前各拍了一張自拍。","ja":"小貝川の水門に到着。白い水門の塔が川をまたぐ。柵のそばやカラフルなモニュメントの前で自撮り。"},{"th":"img/tour_thumb/p_MVIMG_20261004_082505.jpg","full":"img/photo/MVIMG_20261004_082505.jpg","t":"08:25","lat":35.93562,"lng":140.13215,"km":156.123,"seg":0,"zh":"","ja":""},{"th":"img/tour_thumb/p_MVIMG_20261004_074553.jpg","full":"img/photo/MVIMG_20261004_074553.jpg","t":"07:45","lat":35.88062,"lng":140.04185,"km":167.058,"seg":0,"zh":"清晨出發往霞浦騎，在利根川一帶的堤防旁自拍，身後是一片金黃稻田和路面標線。","ja":"早朝、霞ヶ浦へ向けて出発。利根川付近の堤防沿いで自撮り。背後には黄金色の田んぼと路面の標示が見える。"},{"th":"img/tour_thumb/p_MVIMG_20261004_074600.jpg","full":"img/photo/MVIMG_20261004_074600.jpg","t":"07:46","lat":35.88062,"lng":140.04185,"km":167.058,"seg":0,"zh":"","ja":""},{"th":"img/tour_thumb/p_IMG_20261004_174319.jpg","full":"img/photo/IMG_20261004_174319.jpg","t":"17:43","lat":35.86505,"lng":139.97261,"km":173.724,"seg":0,"zh":"回到柏市，先拍了自行車停車場，晚上在居酒屋吃毛豆和雞肉料理，慰勞 174 公里的辛勞。","ja":"柏市に戻り、まず駐輪場を撮影。夜は居酒屋で枝豆や鶏肉料理をいただき、174 km の疲れを癒した。"},{"th":"img/tour_thumb/p_IMG_20261004_180404.jpg","full":"img/photo/IMG_20261004_180404.jpg","t":"18:04","lat":35.86505,"lng":139.97261,"km":173.724,"seg":0,"zh":"","ja":""}]},{"id":"20486289652","name":"柏市午後騎乘","day":"2026-10-07","km":3.01,"long":false,"gain":3,"tmin":21.1,"tmax":21.7,"wmax":1.5,"segs":[{"name":"柏市午後騎乘","type":"Ride","hm":"17:18","km":3.01,"moving":957,"gain":3,"off":0.0,"sc":1.27027,"p":[3590004,13993760,-3,0,-4,-4,-27,-64,-49,-130,-34,-81,-37,-98,-7,-27,-7,-35,-3,-19,-3,-31,-4,-14,0,-8,6,-25,8,-57,41,-145,4,-30,6,-16,4,-21,5,-85,10,-95,0,-35,-22,-188,-3,-31,0,-25,9,-69,12,-115,9,-110,10,-88,0,-28,13,-61,18,-64,8,-50,0,-20,-6,-51,-3,-23,-4,-17,7,-1,   {id:'hs',type:'hillshade',source:'dem2',paint:{'hillshade-exaggeration':0.35,'hillshade-shadow-color':'#1d2b3a'}},
  {id:'rt-c',type:'line',source:'route',paint:{'line-color':'#fff','line-width':6,'line-opacity':.55},layout:{'line-join':'round','line-cap':'round'}},
  {id:'rt',type:'line',source:'route',paint:{'line-color':['get','c'],'line-width':3.5},layout:{'line-join':'round','line-cap':'round'}},
  {id:'pg',type:'line',source:'prog',paint:{'line-color':'#ffb020','line-width':5},layout:{'line-join':'round','line-cap':'round'}}],
  terrain:{source:'dem',exaggeration:1.5}}});
map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),'top-right');
const rel=document.createElement('div');rel.className='rider';
const rider=new maplibregl.Marker({element:rel}).setLngLat([P[0].lng,P[0].lat]).addTo(map);
// 照片標記：同一處（0.25 km 內、同段）併成一組
const G=[];D.photos.forEach((p,i)=>{const g=G[G.length-1];if(g&&p.seg===g.seg&&p.km-g.km<0.25)g.ix.push(i);else G.push({km:p.km,seg:p.seg,ix:[i]});});
G.forEach((g,gi)=>{const p=D.photos[g.ix[0]],el=document.createElement('div');el.className='pm';el.style.backgroundImage=`url("${p.th}")`;
 el.title=p.t+(g.ix.length>1?` (${g.ix.length})`:'');el.onclick=e=>{e.stopPropagation();seek(g.km);showGroup(gi);};
 g.el=el;g.mk=new maplibregl.Marker({element:el}).setLngLat([p.lng,p.lat]).addTo(map);});
// ---- 狀態 ----
const SPD=[60,120,240,480,960,1920,3840];let mode='wall',pos=0,playing=false,follow=true,brg=0,last=0,hold=0,curG=-1;
const $=id=>document.getElementById(id);
$('ti').textContent=D.title;
$('sb').textContent=TX.sub(D.day,D.total_km.toFixed(1),D.segs.length,D.photos.length)+'　'+TX.wx(RD.tmin,RD.tmax,RD.wmax);
function bearingAt(km){const a=at(km),b=at(Math.min(TOT,km+0.8));if(a.seg!==b.seg||Math.abs(b.lat-a.lat)+Math.abs(b.lng-a.lng)<1e-6)return brg;
 return brgOf([a.lat,a.lng],[b.lat,b.lng]);}
function update(cam){
 const p=at(pos);rider.setLngLat([p.lng,p.lat]);
 const coords=[];for(let i=0;i<=p.i;i++){if(P[i].seg===p.seg)coords.push([P[i].lng,P[i].lat]);}coords.push([p.lng,p.lat]);
 const done=D.segs.slice(0,p.seg).map(s=>s.ll.map(q=>[q[1],q[0]]));
 map.getSource('prog')&&map.getSource('prog').setData({type:'Feature',geometry:{type:'MultiLineString',coordinates:[...done,coords]}});
 const s=D.segs[p.seg];$('h_clk').textContent=clock(pos);$('h_km').textContent=pos.toFixed(1);$('h_el').textContent=Math.round(p.el);
 const q=at(Math.max(0,pos-0.15)),gr=q.seg===p.seg&&pos-q.km>0.05?(p.el-q.el)/((pos-q.km)*1000)*100:0;$('h_gr').textContent=gr.toFixed(1)+'%';
 // 天氣：氣溫、風向（箭頭＝風吹去的方向，隨地圖旋轉）、迎風分量
 const w=P[p.i].wx;$('h_tmp').textContent=w.t.toFixed(1)+'°C'+(w.pr>0?' ☂':'');$('h_tmp').title=w.pr>0?TX.rain+' '+w.pr+' mm/h':'';
 $('h_ws').textContent=w.ws.toFixed(1);$('h_wd').textContent=TX.dir[Math.round(w.wd/22.5)%16]+TX.wsuf+' m/s';
 $('wa').style.transform=`rotate(${w.wd+180-map.getBearing()}deg)`;
 const hw=w.ws*Math.cos((w.wd-bearingAt(pos))*Math.PI/180),cr=Math.abs(hw)<w.ws*0.35;
 $('h_hw').innerHTML=cr?`${TX.cross}`:`<span class="${hw>0?'hw':'tw'}">${hw>0?TX.head:TX.tail} ${Math.abs(hw).toFixed(1)}</span>`;
 $('segname').innerHTML=`<span style="color:${COL[s.type]}">●</span> ${TX.seg(p.seg+1)} ${s.hm} ${s.name}（${s.km} km，${TX.gain} ${s.gain} m）`;
 if(cam&&follow){let b=bearingAt(pos),d=((b-brg+540)%360)-180;brg=(brg+d*0.06+360)%360;
  map.jumpTo({center:[p.lng,p.lat],bearing:brg,pitch:62,zoom:Math.min(16,Math.max(mode==='wall'?10.5:12,map.getZoom()))});}
 if(mode==='wall'&&map.getSource('rbox')){map.getSource('rbox').setData(riderBox(p));
  map.setPaintProperty('wall','fill-extrusion-color',['case',['<=',['get','km'],pos+1e-6],RAMP,RAMP2]);}
 drawProf();}
map.on('rotate',()=>{const w=P[at(pos).i].wx;$('wa').style.transform=`rotate(${w.wd+180-map.getBearing()}deg)`;});
function step(t){if(!playing){last=0;return;}const dt=last?Math.min(0.1,(t-last)/1000):0;last=t;
 if(hold>0){hold-=dt;requestAnimationFrame(step);return;}
 const r=anc(pos),avg=r.s.km*1000/r.s.moving;let v=r.pace>0?1/r.pace:avg;v=Math.min(avg*1.8,Math.max(avg*0.45,v));// 當地配速，夾在段均速 0.45–1.8 倍
 const np=Math.min(TOT,pos+v*SPD[$('spd').value]*dt/1000);
 const gi=G.findIndex(g=>g.km>pos+1e-9&&g.km<=np+1e-9);
 if(gi>=0){pos=G[gi].km;showGroup(gi);if($('aps').checked)hold=2.2;}else pos=np;
 if(innerWidth<=640&&curG>=0&&pos-G[curG].km>1.5)pvClose();// 手機畫面小，離開照片點 1.5 km 就收起預覽
 update(true);if(pos>=TOT){setPlay(false);}requestAnimationFrame(step);}
function setPlay(b){playing=b;$('play').textContent=b?TX.pause:TX.play;$('play').classList.toggle('on',b);
 if(b){if(pos>=TOT)pos=0;const g0=G.findIndex(g=>Math.abs(g.km-pos)<0.01);if(g0>=0)showGroup(g0);if(follow)map.easeTo({center:[at(pos).lng,at(pos).lat],zoom:mode==='wall'?12:13.6,pitch:62,bearing:brg=bearingAt(pos),duration:1200});
  setTimeout(()=>requestAnimationFrame(step),b&&follow?1200:0);}}
function seek(km){pos=Math.max(0,Math.min(TOT,km));hold=0;const gi=G.findIndex(g=>Math.abs(g.km-pos)<0.05);if(gi>=0)showGroup(gi);
 else if(curG>=0&&Math.abs(G[curG].km-pos)>1)pvClose();
 if(follow){brg=bearingAt(pos);update(true);}else update(false);}
// ---- 照片預覽 ----
let curPh=0;
const note=p=>(LANG==='ja'?p.ja:p.zh)||p.zh||'';
function showGroup(gi){curG=gi;G.forEach((g,j)=>g.el.classList.toggle('hit',j===gi));const g=G[gi];
 $('pvs').innerHTML=g.ix.length>1?g.ix.map(i=>`<img src="${D.photos[i].th}" data-i="${i}">`).join(''):'';
 $('pvs').querySelectorAll('img').forEach(im=>im.onclick=()=>showPh(+im.dataset.i));showPh(g.ix[0]);$('pv').style.display='block';pad();}
function showPh(i){curPh=i;const p=D.photos[i];$('pvi').src=p.th;$('pvt').textContent=`${p.t}　${p.km.toFixed(1)} km`;$('pvn').textContent=note(p);
 $('pvs').querySelectorAll('img').forEach(im=>im.classList.toggle('on',+im.dataset.i===i));}
function pvClose(){curG=-1;$('pv').style.display='none';G.forEach(g=>g.el.classList.remove('hit'));pad();}
// 鏡頭跟隨時讓騎士落在沒被預覽卡蓋住的區域（地圖 padding）
function pad(){const o=$('pv').style.display==='block',w=innerWidth,r=$('pv').getBoundingClientRect();
 map.setPadding({top:0,left:0,right:o&&w>640?Math.round(w-r.left):0,bottom:o&&w<=640?Math.round(innerHeight-r.top):0});}
$('pvi').onclick=()=>{const p=D.photos[curPh];const im=$('lbi');im.onerror=()=>{im.onerror=null;im.src=p.th;};im.src=p.full;$('lbn').textContent=p.t+'　'+note(p);$('lb').style.display='flex';};
// ---- 剖面：海拔（面積）、氣溫（線，右軸）、迎風分量（底部色帶）----
const cv=$('prof'),cx=cv.getContext('2d');const PL=34,PR=34,PB=24;
function drawProf(){const w=cv.clientWidth,h=cv.clientHeight,r=devicePixelRatio||1;if(cv.width!==w*r){cv.width=w*r;cv.height=h*r;}
 cx.setTransform(r,0,0,r,0,0);cx.clearRect(0,0,w,h);const X=km=>PL+(w-PL-PR)*km/TOT,Y=e=>4+(h-PB-8)*(1-(e-EMIN)/(ETOP-EMIN));
 const tlo=Math.floor(TMIN-0.5),thi=Math.max(tlo+2,Math.ceil(TMAX+0.5)),YT=t=>4+(h-PB-8)*(1-(t-tlo)/(thi-tlo));
 cx.font='10px system-ui';cx.fillStyle='#9aa8b8';cx.textAlign='right';[EMIN,ETOP].forEach(e=>cx.fillText(Math.round(e)+' m',PL-4,Y(e)+3));
 cx.textAlign='left';cx.fillStyle='#ffcf70';[tlo,thi].forEach(t=>cx.fillText(t+'°',w-PR+4,YT(t)+3));
 cx.fillStyle='#9aa8b8';cx.textAlign='center';const stp=TOT>60?20:TOT>20?5:TOT>8?2:1;for(let k=0;k<=TOT;k+=stp)cx.fillText(k+' km',X(k),h-1);
 D.segs.forEach(s=>{cx.beginPath();s.d.forEach((km,i)=>i?cx.lineTo(X(km),Y(s.el[i])):cx.moveTo(X(km),Y(s.el[i])));
  cx.lineTo(X(s.d[s.d.length-1]),h-PB);cx.lineTo(X(s.d[0]),h-PB);cx.closePath();cx.fillStyle=(COL[s.type]||'#3d8bff')+'55';cx.fill();
  cx.beginPath();s.d.forEach((km,i)=>i?cx.lineTo(X(km),Y(s.el[i])):cx.moveTo(X(km),Y(s.el[i])));cx.strokeStyle=COL[s.type];cx.lineWidth=1.5;cx.stroke();
  cx.beginPath();s.d.forEach((km,i)=>i?cx.lineTo(X(km),YT(s.wx[i].t)):cx.moveTo(X(km),YT(s.wx[i].t)));cx.strokeStyle='#ffcf70';cx.lineWidth=1.2;cx.setLineDash([4,3]);cx.stroke();cx.setLineDash([]);});
 // 迎風分量色帶：紅＝逆風、綠＝順風，深淺＝強度
 for(let i=1;i<P.length;i++){const a=P[i-1],b=P[i];if(a.seg!==b.seg)continue;const v=(a.hw+b.hw)/2,al=Math.min(1,Math.abs(v)/HWM)*.9+.1;
  cx.fillStyle=v>0?`rgba(255,107,91,${al})`:`rgba(76,195,138,${al})`;cx.fillRect(X(a.km),h-PB+2,Math.max(1,X(b.km)-X(a.km)),7);}
 G.forEach((g,j)=>{cx.fillStyle=j===curG?'#ffb020':'#e8eef5';cx.fillRect(X(g.km)-1,h-PB-6,2,6);});
 const p=at(pos);cx.strokeStyle='#ffb020';cx.lineWidth=2;cx.beginPath();cx.moveTo(X(pos),2);cx.lineTo(X(pos),h-PB+9);cx.stroke();
 cx.fillStyle='#ffb020';cx.beginPath();cx.arc(X(pos),Y(p.el),4,0,7);cx.fill();}
let drag=false;const profKm=e=>{const b=cv.getBoundingClientRect();return Math.max(0,Math.min(TOT,(e.clientX-b.left-PL)/(b.width-PL-PR)*TOT));};
cv.onpointerdown=e=>{drag=true;cv.setPointerCapture(e.pointerId);seek(profKm(e));};cv.onpointermove=e=>{if(drag)seek(profKm(e));};cv.onpointerup=()=>drag=false;
// ---- 控制 ----
$('play').textContent=TX.play;
const spdTxt=()=>{$('spdv').textContent=SPD[$('spd').value]+'×';};spdTxt();$('spd').oninput=spdTxt;
$('play').onclick=()=>setPlay(!playing);$('rst').onclick=()=>{seek(0);};
$('fol').onclick=()=>{follow=!follow;$('fol').classList.toggle('on',follow);if(follow){brg=bearingAt(pos);update(true);}};
function overview(){follow=false;$('fol').classList.remove('on');const b=new maplibregl.LngLatBounds();P.forEach(p=>b.extend([p.lng,p.lat]));
 map.fitBounds(b,{padding:{top:150,bottom:210,left:40,right:60},pitch:50,bearing:-20,duration:1500,maxZoom:14});}
$('ovw').onclick=overview;
const wk=()=>+$('wk').value;
function setMode(m){mode=m;$('md').value=m;const w=m==='wall';
 map.setTerrain(w?null:{source:'dem',exaggeration:+$('exg').value});
 ['wall','rbox-l'].forEach(id=>map.setLayoutProperty(id,'visibility',w?'visible':'none'));
 map.setLayoutProperty('hs','visibility',w?'none':'visible');
 $('wkl').style.display=w?'':'none';$('exl').style.display=w?'none':'';

const wkTxt=()=>{$('wkv').textContent=wk()+'×';};wkTxt();
$('wk').oninput=()=>{wkTxt();map.setPaintProperty('wall','fill-extrusion-height',['*',['get','e'],wk()]);
 map.setPaintProperty('rbox-l','fill-extrusion-base',['*',['get','e'],wk()]);map.setPaintProperty('rbox-l','fill-extrusion-height',['+',['*',['get','e'],wk()],250]);};
map.on('dragstart',()=>{if(follow&&playing){follow=false;$('fol').classList.remove('on');}});
const exgTxt=()=>{$('exgv').textContent=$('exg').value+'×';};exgTxt();
$('exg').oninput=()=>{exgTxt();if(mode==='terrain')map.setTerrain({source:'dem',exaggeration:+$('exg').value});};

document.addEventListener('keydown',e=>{if(e.code==='Space'&&!['INPUT','SELECT'].includes(e.target.tagName)){e.preventDefault();setPlay(!playing);}});
// 窄螢幕（≤1000px，會與左上資訊框重疊）預覽卡改放在底部控制列正上方

addEventListener('resize',place);place();
map.on('load',()=>{
 map.addSource('wall',{type:'geojson',data:wallFC});map.addSource('rbox',{type:'geojson',data:riderBox(P[0])});
 map.addLayer({id:'wall',type:'fill-extrusion',source:'wall',paint:{'fill-extrusion-color':RAMP,'fill-extrusion-height':['*',['get','e'],wk()],'fill-extrusion-base':0,'fill-extrusion-opacity':.92}});
 map.addLayer({id:'rbox-l',type:'fill-extrusion',source:'rbox',paint:{'fill-extrusion-color':'#ffb020','fill-extrusion-base':['*',['get','e'],wk()],'fill-extrusion-height':['+',['*',['get','e'],wk()],250]}});
